name: Test iPhone WebDAV over Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-webdav:
    name: Verify GitHub runner can read iPhone files
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.124.74.102

      - name: Verify WebDAV directory listing
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/iphone-webdav.xml"
          status="$(curl --silent --show-error --max-time 20 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request PROPFIND \
            --header 'Depth: 1' \
            'http://100.124.74.102:49215/')"
          echo "WebDAV HTTP status: $status"
          test "$status" = "207"
          grep -q '<D:multistatus' "$response_file"
          echo "SUCCESS: GitHub Actions can list the iPhone WebDAV directory."

      - name: Read only the first 1 KiB of a large file
        shell: bash
        run: |
          set -euo pipefail

          url='http://100.124.74.102:49215/nxnative-0100B99019412000-IPA-and-logs.zip'
          output="$RUNNER_TEMP/iphone-range-test.bin"

          # Request exactly bytes 0-1023. The size cap prevents a full-file
          # download if the server ignores the Range header.
          status="$(curl --silent --show-error --location --max-time 30 \
            --max-filesize 2048 \
            --range 0-1023 \
            --output "$output" \
            --write-out '%{http_code}' \
            "$url")"

          bytes="$(wc -c < "$output" | tr -d ' ')"
          echo "HTTP status: $status"
          echo "Bytes received: $bytes"

          if [[ "$status" != "206" || "$bytes" != "1024" ]]; then
            echo "::error::Expected HTTP 206 and exactly 1024 bytes. Range request was not confirmed."
            exit 1
          fi

          echo "SUCCESS: GitHub Actions read exactly 1 KiB directly from the iPhone."
