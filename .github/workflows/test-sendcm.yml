name: Test SendCM direct download

on:
  workflow_dispatch:

jobs:
  test-sendcm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test SendCM link from GitHub runner
        env:
          SENDCM_URL: ${{ secrets.SENDCM_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SENDCM_URL:-}" ]; then
            echo "::error::Add SENDCM_URL as a repository Actions secret before running this test."
            exit 1
          fi
          echo "Testing SendCM with curl, following redirects and requesting the first 1 MiB..."
          set +e
          curl --silent --show-error --location \
            --connect-timeout 20 --max-time 90 --retry 1 --retry-delay 2 \
            --range 0-1048575 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36" \
            --output "$RUNNER_TEMP/sendcm-test.bin" \
            --write-out $'HTTP status: %{http_code}\nContent type: %{content_type}\nBytes received: %{size_download}\nElapsed: %{time_total}s\nAverage speed: %{speed_download} bytes/sec\n' \
            "$SENDCM_URL"
          curl_rc=$?
          set -e

          echo "curl exit code: $curl_rc"
          if [ -f "$RUNNER_TEMP/sendcm-test.bin" ]; then
            file_size=$(wc -c < "$RUNNER_TEMP/sendcm-test.bin" | tr -d ' ')
            echo "Saved test bytes: $file_size"
            if head -c 512 "$RUNNER_TEMP/sendcm-test.bin" | grep -Eiq '<!doctype html|<html'; then
              echo "RESULT: Received HTML rather than the archive; likely a landing page, challenge, or session requirement."
              exit 1
            fi
          else
            echo "No response body was saved."
          fi

          if [ "$curl_rc" -ne 0 ]; then
            echo "RESULT: curl could not complete the request from the GitHub runner."
            exit 1
          fi
          if [ "${file_size:-0}" -eq 0 ]; then
            echo "RESULT: No file data received."
            exit 1
          fi
          echo "RESULT: GitHub runner received file data. This confirms access to a response, not a complete archive download."
