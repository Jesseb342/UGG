name: "Build unsigned nxnative IPA"

on:
  workflow_dispatch:
    inputs:
      device_target:
        description: "Choose your target iPhone"
        required: true
        type: choice
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional base-game title ID override, e.g. 0100B99019412000"
        required: false
        type: string
      probe_only:
        description: "Only inspect nxnative source (fast, no game build)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "nxnative-ipa-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  probe:
    name: "Inspect nxnative source (no game download)"
    if: "${{ inputs.probe_only }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Fetch nxnative at the BC-fallback commit"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://codeload.github.com/mianmuhammadse/nxnative/tar.gz/d158df611bf2f3fa315c4f16585575cdfdb2a1d3" \
            -o "$RUNNER_TEMP/nxnative.tar.gz"
          mkdir -p nxnative
          tar -xzf "$RUNNER_TEMP/nxnative.tar.gz" --strip-components=1 -C nxnative

      - name: "Collect graphics-path detection code"
        shell: bash
        working-directory: nxnative
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/probe"
          mkdir -p "$OUT/files"
          grep -rIl -e "glShaderSource" -e "gl_shaders" -e "NVN shader steps" \
            --include='*.py' --include='*.sh' . | sort > "$OUT/matching-files.txt"
          find "$OUT" -type f -print

      - name: "Upload probe results"
        uses: actions/upload-artifact@v4
        with:
          name: "nxnative-probe"
          path: "${{ github.workspace }}/probe/"
          if-no-files-found: error
          retention-days: 3

  build:
    name: "Build unsigned iOS IPA"
    if: "${{ !inputs.probe_only }}"
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      PROD_KEYS_BASE64: "${{ secrets.Keys_URL }}"
      SENDCM_URL: "${{ secrets.SENDCM_URL }}"
      UPDATE_URL: "${{ secrets.update_URL }}"
      DEVICE_TARGET: "${{ inputs.device_target }}"
      PROFILE_OVERRIDE: "${{ inputs.profile_id }}"
      GAME_DIR: "${{ github.workspace }}/GameFiles"

    steps:
      - name: "Validate direct download and key inputs"
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SENDCM_URL" ]] || { echo "::error::Missing SENDCM_URL secret."; exit 1; }
          [[ -n "$PROD_KEYS_BASE64" ]] || { echo "::error::Missing PROD_KEYS_BASE64 secret."; exit 1; }

      - name: "Decode and validate prod.keys"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR/keys"
          python3 - "$GAME_DIR/keys/prod.keys" <<'PY'
          import base64, os, sys
          path = sys.argv[1]
          encoded = os.environ.get("PROD_KEYS_BASE64", "").strip()
          if not encoded:
              raise SystemExit("PROD_KEYS_BASE64 secret is empty")
          try:
              raw = base64.b64decode("".join(encoded.split()), validate=True)
          except Exception as e:
              raise SystemExit(f"PROD_KEYS_BASE64 is not valid Base64: {e}")
          with open(path, "wb") as f:
              f.write(raw)
          print(f"prod.keys decoded and validated ({len(raw):,} bytes).")
          PY

      - name: "Install .NET 10 SDK"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl --fail --show-error --location --retry 3 \
            https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --version 10.0.100 \
            --install-dir "$RUNNER_TEMP/dotnet" \
            --no-path
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install gdown lz4 zstd spirv-cross glslang xcodegen unar p7zip

          python3 -m venv "$RUNNER_TEMP/nxnative-venv"
          source "$RUNNER_TEMP/nxnative-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install capstone fonttools lz4 zstandard
          echo "$RUNNER_TEMP/nxnative-venv/bin" >> "$GITHUB_PATH"

      - name: "Download nxnative source"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEVICE_TARGET" == "iPhone 15 or older (BC fallback)" ]]; then
            curl --fail --location --retry 3 \
              "https://codeload.github.com/mianmuhammadse/nxnative/tar.gz/d158df611bf2f3fa315c4f16585575cdfdb2a1d3" \
              -o "$RUNNER_TEMP/nxnative.tar.gz"
            mkdir -p nxnative
            tar -xzf "$RUNNER_TEMP/nxnative.tar.gz" --strip-components=1 -C nxnative
            echo "NXNATIVE_MODE=bc-fallback" >> "$GITHUB_ENV"
          else
            git clone https://github.com/seedds/nxnative.git nxnative
            echo "NXNATIVE_MODE=standard" >> "$GITHUB_ENV"
          fi
          echo "NXNATIVE_DIR=$GITHUB_WORKSPACE/nxnative" >> "$GITHUB_ENV"

      - name: "Cache shader translator"
        id: shader-cache
        uses: actions/cache@v4
        with:
          path: "nxnative/dm/gfx/tools/dmsh_xlate_bin"
          key: "nxnative-shader-translator-${{ runner.os }}-${{ runner.arch }}-dotnet10-${{ hashFiles('nxnative/dm/gfx/tools/dmsh_xlate/**/*') }}"

      - name: "Rebuild shader translator"
        if: "${{ steps.shader-cache.outputs.cache-hit != 'true' }}"
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) RID=osx-arm64 ;;
            x86_64) RID=osx-x64 ;;
            *) echo "::error::Unsupported runner architecture"; exit 1 ;;
          esac
          dotnet publish dm/gfx/tools/dmsh_xlate -c Release -r "$RID" --self-contained true -p:UseAppHost=true -o dm/gfx/tools/dmsh_xlate_bin

      - name: "Download game archive from direct link"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR/downloads"
          curl --fail --show-error --location \
            --connect-timeout 30 --max-time 7200 \
            --retry 3 --retry-delay 5 \
            --output "$GAME_DIR/downloads/game-archive.rar" \
            "$SENDCM_URL"

      - name: "Extract archives and collect NSP files"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR/extracted" "$GAME_DIR/nsp"
          for file in "$GAME_DIR"/downloads/*; do
            [[ -f "$file" ]] || continue
            unar -force-overwrite -output-directory "$GAME_DIR/extracted" "$file"
          done
          find "$GAME_DIR/extracted" -type f \( -iname '*.nsp' -o -iname '*.nsz' \) -exec cp -f {} "$GAME_DIR/nsp/" \;

      - name: "Identify base game title ID"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PROFILE_OVERRIDE" ]]; then
            DM_GAME="${PROFILE_OVERRIDE^^}"
            DM_GAME="${DM_GAME#0X}"
          else
            BASE_FILE="$(find "$GAME_DIR/nsp" -maxdepth 1 -type f -iname '*.nsp' | head -n 1 || true)"
            DM_GAME="$(basename "$BASE_FILE" | grep -Eio '\[([0-9a-f]{16})\]' | head -n 1 | tr -d '[]' | tr '[:lower:]' '[:upper:]' || true)"
          fi
          echo "DM_GAME=$DM_GAME" >> "$GITHUB_ENV"

      - name: "Prepare game directory"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GAME_DIR/GameFiles"
          find "$GAME_DIR/nsp" -maxdepth 1 -type f \( -iname '*.nsp' -o -iname '*.nsz' \) -exec cp -f {} "$GAME_DIR/GameFiles/" \;
          echo "BUILD_GAME_DIR=$GAME_DIR/GameFiles" >> "$GITHUB_ENV"

      - name: "Build IPA using automatic profile generation"
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail
          python3 scripts/build_ipa_from_nsp.py "$BUILD_GAME_DIR" -k "$GAME_DIR/keys/prod.keys" -o "$GAME_DIR/${DM_GAME}.ipa" || true

      - name: "Collect build diagnostics and profile"
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          DIAG_DIR="$GAME_DIR/diagnostics"
          mkdir -p "$DIAG_DIR"
          if [[ -n "${DM_GAME:-}" ]]; then
            BUILD_ROOT="$GAME_DIR/GameFiles/${DM_GAME}_build"
            SHDIR="$(find "$BUILD_ROOT/extract" -type d -path '*/RomFS/Content/Shaders' -print -quit 2>/dev/null || true)"
            if [[ -n "$SHDIR" ]]; then
              {
                echo "Shader directory: $SHDIR"
                find "$SHDIR" -type f -exec ls -l {} \; | awk '{print $5, $NF}' | sed "s#$SHDIR/##"
                find "$SHDIR" -type f -name '*.nvn' | sort | head -8 | while read -r f; do
                  echo "== ${f#$SHDIR/} ($(wc -c < "$f") bytes)"
                  xxd -l 64 "$f"
                done
              } > "$DIAG_DIR/shader-files.txt" 2>&1
            fi
          fi

      - name: "Upload build diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "nxnative-${{ env.DM_GAME || 'diagnostics' }}-diagnostics"
          path: "${{ github.workspace }}/GameFiles/diagnostics/"
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload IPA"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "nxnative-${{ env.DM_GAME || 'IPA' }}-IPA"
          path: "${{ github.workspace }}/GameFiles/*.ipa"
          if-no-files-found: ignore
          retention-days: 7
