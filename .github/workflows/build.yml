
name: Build unsigned nxnative IPA

on:
  workflow_dispatch:
    inputs:
      device_target:
        description: "Choose your target iPhone"
        required: true
        type: choice
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional base-game title ID override, e.g. 0100B99019412000"
        required: false
        type: string
      transfer_source:
        description: "Where to retrieve game files"
        required: true
        type: choice
        default: "iPhone WebDAV"
        options:
          - "iPhone WebDAV"
          - "Existing URL secrets"
      game_filename:
        description: "Choose the base game from the iPhone WebDAV folder"
        required: true
        type: choice
        options:
          - "RAYMLEGDE-NSwTcH-%5BBASE%5D-NSP-Ziperto.rar"
          - "UGG-(RF)-NSwTcH-NSP-Ziperto.rar"
      update_filename:
        description: "Choose an update, or None"
        required: true
        default: "None"
        type: choice
        options:
          - "None"
          - "RAYMLEGDE-NSwTcH-NSP-Update12-Ziperto.rar"
          - "UGG-NSwTcH-NSP-Update112-Ziperto.rar"
      dlc_filename:
        description: "Choose DLC, or None (no DLC package is currently listed)"
        required: true
        default: "None"
        type: choice
        options:
          - "None"
      keys_filename:
        description: "Exact prod.keys filename in PocketServer (iPhone WebDAV mode)"
        required: false
        default: "prod.keys"
        type: string

permissions:
  contents: read

concurrency:
  group: nxnative-ipa-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      GAME_URL: ${{ secrets.Game_URL }}
      UPDATE_URL: ${{ secrets.Update_URL }}
      DLC_URL: ${{ secrets.DLC_URL }}
      KEYS_URL: ${{ secrets.Keys_URL }}
      DEVICE_TARGET: ${{ inputs.device_target }}
      PROFILE_OVERRIDE: ${{ inputs.profile_id }}
      GAME_DIR: ${{ github.workspace }}/GameFiles
      TRANSFER_SOURCE: ${{ inputs.transfer_source }}
      GAME_FILENAME: ${{ inputs.game_filename }}
      UPDATE_FILENAME: ${{ inputs.update_filename == 'None' && '' || inputs.update_filename }}
      DLC_FILENAME: ${{ inputs.dlc_filename == 'None' && '' || inputs.dlc_filename }}
      KEYS_FILENAME: ${{ inputs.keys_filename }}

    steps:
      - name: Check selected file source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TRANSFER_SOURCE" == "iPhone WebDAV" ]]; then
            [[ -n "$GAME_FILENAME" ]] || { echo "::error::Enter game_filename"; exit 1; }
            [[ -n "$KEYS_FILENAME" ]] || { echo "::error::Enter keys_filename"; exit 1; }
          else
            [[ -n "$GAME_URL" ]] || { echo "::error::Missing Game_URL"; exit 1; }
            [[ -n "$KEYS_URL" ]] || { echo "::error::Missing Keys_URL"; exit 1; }
          fi

      - name: Connect runner to iPhone over Tailscale
        if: inputs.transfer_source == 'iPhone WebDAV'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.124.74.102
          args: --accept-dns=false

      - name: Install .NET 10 SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl --fail --show-error --location --retry 3 \
            https://dot.net/v1/dotnet-install.sh \
            -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" \
            --version 10.0.100 \
            --install-dir "$RUNNER_TEMP/dotnet" \
            --no-path
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/dotnet/dotnet" --info

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install gdown lz4 zstd spirv-cross xcodegen unar p7zip

          python3 -m venv "$RUNNER_TEMP/nxnative-venv"
          source "$RUNNER_TEMP/nxnative-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install capstone fonttools lz4 zstandard

          echo "$RUNNER_TEMP/nxnative-venv/bin" >> "$GITHUB_PATH"

          dotnet --info
          python --version

      - name: Download nxnative source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DEVICE_TARGET" == "iPhone 15 or older (BC fallback)" ]]; then
            curl --fail --location --retry 3 \
              "https://codeload.github.com/mianmuhammadse/nxnative/tar.gz/d158df611bf2f3fa315c4f16585575cdfdb2a1d3" \
              -o "$RUNNER_TEMP/nxnative.tar.gz"

            mkdir -p nxnative

            tar -xzf "$RUNNER_TEMP/nxnative.tar.gz" \
              --strip-components=1 -C nxnative

            echo "NXNATIVE_MODE=bc-fallback" >> "$GITHUB_ENV"
          else
            git clone https://github.com/seedds/nxnative.git nxnative
            echo "NXNATIVE_MODE=standard" >> "$GITHUB_ENV"
          fi

          test -f nxnative/scripts/build_ipa_from_nsp.py

          echo "NXNATIVE_DIR=$GITHUB_WORKSPACE/nxnative" >> "$GITHUB_ENV"

      - name: Rebuild shader translator
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            arm64|aarch64) RID=osx-arm64 ;;
            x86_64) RID=osx-x64 ;;
            *) echo "::error::Unsupported runner architecture"; exit 1 ;;
          esac

          dotnet publish dm/gfx/tools/dmsh_xlate \
            -c Release -r "$RID" \
            --self-contained true \
            -p:UseAppHost=true \
            -o dm/gfx/tools/dmsh_xlate_bin

          TRANSLATOR=dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate

          test -f "$TRANSLATOR"
          chmod +x "$TRANSLATOR"

          "$TRANSLATOR" --source-sha

      - name: Download game, optional update/DLC, and keys
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GAME_DIR/downloads" "$GAME_DIR/keys"

          classify_archive() {
            local destination="$1"
            local file_type
            file_type="$(file -b "$destination")"
            case "$file_type" in
              *"Zip archive"*) mv "$destination" "${destination}.zip" ;;
              *"RAR archive"*) mv "$destination" "${destination}.rar" ;;
              *"7-zip archive"*) mv "$destination" "${destination}.7z" ;;
              *"gzip compressed"*) mv "$destination" "${destination}.tar.gz" ;;
              *) mv "$destination" "${destination}.nsp" ;;
            esac
          }

          download_webdav_file() {
            local filename="$1"
            local destination="$2"
            local label="$3"
            [[ -n "$filename" ]] || { echo "Skipping optional $label."; return 0; }

            local encoded
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$filename")"
            echo "Downloading $label directly from iPhone: $filename"
            curl --fail --show-error --location --retry 3 --retry-delay 2 \
              --connect-timeout 20 --output "$destination" \
              "http://100.124.74.102:49215/$encoded"
            test -s "$destination"
            if [[ "$label" != "prod.keys" ]]; then classify_archive "$destination"; fi
          }

          download_url_file() {
            local url="$1"
            local destination="$2"
            local label="$3"
            [[ -n "$url" ]] || { echo "Skipping optional $label."; return 0; }
            echo "Downloading $label from configured URL..."
            curl --fail --show-error --location --retry 3 --retry-delay 2 \
              --output "$destination" "$url"
            test -s "$destination"
            if [[ "$label" != "prod.keys" ]]; then classify_archive "$destination"; fi
          }

          if [[ "$TRANSFER_SOURCE" == "iPhone WebDAV" ]]; then
            download_webdav_file "$GAME_FILENAME" "$GAME_DIR/downloads/game" "base game"
            download_webdav_file "$UPDATE_FILENAME" "$GAME_DIR/downloads/update" "update"
            download_webdav_file "$DLC_FILENAME" "$GAME_DIR/downloads/dlc" "DLC"
            download_webdav_file "$KEYS_FILENAME" "$GAME_DIR/keys/prod.keys" "prod.keys"
          else
            download_url_file "$GAME_URL" "$GAME_DIR/downloads/game" "base game"
            download_url_file "$UPDATE_URL" "$GAME_DIR/downloads/update" "update"
            download_url_file "$DLC_URL" "$GAME_DIR/downloads/dlc" "DLC"
            download_url_file "$KEYS_URL" "$GAME_DIR/keys/prod.keys" "prod.keys"
          fi

          test -s "$GAME_DIR/keys/prod.keys" || {
            echo "::error::prod.keys download failed"
            exit 1
          }

      - name: Extract archives and collect NSP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GAME_DIR/extracted" "$GAME_DIR/nsp"

          shopt -s nullglob

          for file in "$GAME_DIR"/downloads/*; do
            [[ -f "$file" ]] || continue

            case "$file" in
              *.zip|*.ZIP)
                ditto -x -k "$file" "$GAME_DIR/extracted" ;;
              *.rar|*.RAR)
                unar -force-overwrite -output-directory "$GAME_DIR/extracted" "$file" ;;
              *.7z|*.7Z)
                7z x -y "-o$GAME_DIR/extracted" "$file" ;;
              *.tar.gz|*.tgz)
                tar -xzf "$file" -C "$GAME_DIR/extracted" ;;
              *)
                cp -f "$file" "$GAME_DIR/extracted/$(basename "$file")" ;;
            esac
          done

          find "$GAME_DIR/extracted" -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) \
            -exec cp -f {} "$GAME_DIR/nsp/" \;

          find "$GAME_DIR/downloads" -maxdepth 1 -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) \
            -exec cp -f {} "$GAME_DIR/nsp/" \;

          if ! find "$GAME_DIR/nsp" -maxdepth 1 -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) -print -quit | grep -q .; then
            echo "::error::No NSP/NSZ packages found"
            exit 1
          fi

          echo "Packages found:"
          find "$GAME_DIR/nsp" -maxdepth 1 -type f -print

      - name: Identify base game title ID
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$PROFILE_OVERRIDE" ]]; then
            DM_GAME="${PROFILE_OVERRIDE^^}"
            DM_GAME="${DM_GAME#0X}"
          else
            BASE_FILE="$(
              find "$GAME_DIR/nsp" -maxdepth 1 -type f -iname '*.nsp' |
              grep -Ei '\[v0\]' | head -n 1 || true
            )"

            if [[ -z "$BASE_FILE" ]]; then
              BASE_FILE="$(
                find "$GAME_DIR/nsp" -maxdepth 1 -type f -iname '*.nsp' |
                grep -Eiv '\[v[1-9][0-9]*\]' | head -n 1 || true
              )"
            fi

            if [[ -z "$BASE_FILE" ]]; then
              BASE_FILE="$(find "$GAME_DIR/nsp" -maxdepth 1 -type f -iname '*.nsp' | head -n 1 || true)"
            fi

            DM_GAME="$(
              basename "$BASE_FILE" |
              grep -Eio '\[([0-9a-f]{16})\]' | head -n 1 |
              tr -d '[]' | tr '[:lower:]' '[:upper:]' || true
            )"
          fi

          [[ "$DM_GAME" =~ ^[0-9A-F]{16}$ ]] || {
            echo "::error::Could not identify title ID. Set profile_id in workflow inputs."
            exit 1
          }

          echo "DM_GAME=$DM_GAME" >> "$GITHUB_ENV"
          echo "Detected title ID: $DM_GAME"

      - name: Repair shader-chain lock and header
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          export DM_GAME=0100000000010000

          echo "Updating shader toolchain lock to match this runner..."

          dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate --source-sha
          python3 dm/gfx/tools/dmsh_chain.py --update-lock
          python3 dm/gfx/tools/dmsh_chain.py --header

          echo "Shader-chain lock and header updated."

      - name: Patch AAC movie decoder for Mario vs Donkey Kong only
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          if [[ "$DM_GAME" != "0100B99019412000" ]]; then
            echo "Not Mario vs Donkey Kong. Skipping AAC patch."
            exit 0
          fi

          FILE="dm/host/hle_movie.c"

          test -f "$FILE" || {
            echo "::error::Movie decoder source not found: $FILE"
            exit 1
          }

          python3 - "$FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          text, count = re.subn(
              r'(#\s*define\s+MD_NOUT\s+)64\b',
              r'\g<1>32',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not safely find '#define MD_NOUT 64'.")

          pattern = r'\*size\s*=\s*MD_PCM_CAP\s*;\s*\*mode\s*=\s*d->mode\s*;'

          replacement = (
              'int sbr = d->vhdr_n[0] > 0 && '
              '((d->vhdr[0][0] >> 3) == 5 || '
              '(d->vhdr[0][0] >> 3) == 29); '
              '*size = d->type == MD_TYPE_AAC && d->ch > 0 '
              '? 1024 * (sbr ? 2 : 1) * d->ch * 2 : MD_PCM_CAP; '
              '*mode = d->mode;'
          )

          text, size_count = re.subn(pattern, replacement, text, count=1)

          if size_count != 1:
              raise SystemExit("Could not safely find the expected buffer-size assignment.")

          path.write_text(text)

          print("Applied Mario AAC output-slot and buffer-size fix.")
          PY

      - name: Add Goose SDK Break register diagnostics
        if: env.DM_GAME == '010082400BCC6000'
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("dm/host/hle_svc.c")
          source = path.read_text()

          old = 'LOG("Break#%d reason=%#llx Result=%#x svc at %s+%#llx", ++nb, regs[0], res, mm ? mm->name : "?", orig_addr);'
          new = """LOG("Break#%d reason=%#llx Result=%#x svc at %s+%#llx", ++nb, regs[0], res, mm ? mm->name : "?", orig_addr);
                  module_t *ret_mm = module_of((void *)regs[30]);
                  LOG("[Break registers] x0=%#llx x1=%#llx x2=%#llx x3=%#llx x4=%#llx x5=%#llx x6=%#llx x7=%#llx x8=%#llx",
                      regs[0], regs[1], regs[2], regs[3], regs[4], regs[5], regs[6], regs[7], regs[8]);
                  LOG("[Break registers] x19=%#llx x20=%#llx x21=%#llx x22=%#llx x23=%#llx x24=%#llx x25=%#llx x26=%#llx x27=%#llx x28=%#llx fp=%#llx lr=%#llx",
                      regs[19], regs[20], regs[21], regs[22], regs[23], regs[24], regs[25], regs[26], regs[27], regs[28], regs[29], regs[30]);
                  LOG("[Break return] %s+%#llx", ret_mm ? ret_mm->name : "?", ret_mm ? (unsigned long long)((uintptr_t)regs[30] - (uintptr_t)ret_mm->base) : 0ull);"""

          if source.count(old) != 1:
              raise SystemExit("Expected Break log line was not found exactly once; refusing to patch.")
          path.write_text(source.replace(old, new, 1))
          print("Installed Goose-only Break register and return-address diagnostics.")
          PY

          grep -n -A8 'Break registers' dm/host/hle_svc.c

      - name: Prepare game directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GAME_DIR/GameFiles"

          find "$GAME_DIR/nsp" -maxdepth 1 -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) \
            -exec cp -f {} "$GAME_DIR/GameFiles/" \;

          echo "BUILD_GAME_DIR=$GAME_DIR/GameFiles" >> "$GITHUB_ENV"

      - name: Build IPA using automatic profile generation
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          {
            echo "========================================"
            echo "nxnative build diagnostics"
            echo "========================================"
            echo "Build date: $(date -u)"
            echo "Game title ID: $DM_GAME"
            echo "Target mode: $NXNATIVE_MODE"
            echo "Runner: $(uname -a)"
            echo "Architecture: $(uname -m)"
            echo "Python: $(python3 --version)"
            echo "========================================"

            echo "Starting IPA build..."

            python3 scripts/build_ipa_from_nsp.py \
              "$BUILD_GAME_DIR" \
              -k "$GAME_DIR/keys/prod.keys" \
              -o "$GAME_DIR/${DM_GAME}.ipa"

            test -s "$GAME_DIR/${DM_GAME}.ipa"

            echo "IPA successfully created:"
            ls -lh "$GAME_DIR/${DM_GAME}.ipa"

          } 2>&1 | tee "$GAME_DIR/build-diagnostics.log"

      - name: Collect provisional profile and build diagnostics
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          DIAG_DIR="$GAME_DIR/diagnostics"

          mkdir -p "$DIAG_DIR"

          {
            echo "nxnative build diagnostic summary"
            echo "=================================="
            echo "Date: $(date -u)"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Device target: $DEVICE_TARGET"
            echo "Detected game title ID: ${DM_GAME:-not detected}"
            echo "Build mode: ${NXNATIVE_MODE:-not detected}"
            echo ""
            echo "Expected provisional profile:"
            echo "GameFiles/GameFiles/${DM_GAME:-UNKNOWN}_build/profile/${DM_GAME:-UNKNOWN}/game.tsv"
            echo ""
          } > "$DIAG_DIR/metadata.txt"

          if [[ -f "$GAME_DIR/build-diagnostics.log" ]]; then
            cp "$GAME_DIR/build-diagnostics.log" "$DIAG_DIR/"
          fi

          if [[ -n "${DM_GAME:-}" ]]; then
            PROFILE_DIR="$GAME_DIR/GameFiles/${DM_GAME}_build/profile/${DM_GAME}"

            if [[ -d "$PROFILE_DIR" ]]; then
              echo "Found provisional profile at: $PROFILE_DIR" \
                >> "$DIAG_DIR/metadata.txt"

              cp -R "$PROFILE_DIR" "$DIAG_DIR/provisional-profile"
            else
              echo "Expected profile directory not found." \
                >> "$DIAG_DIR/metadata.txt"

              MATCH="$(
                find "$GAME_DIR/GameFiles" -type f \
                  -path "*/profile/${DM_GAME}/game.tsv" \
                  -print -quit 2>/dev/null || true
              )"

              if [[ -n "$MATCH" ]]; then
                PROFILE_DIR="${MATCH%/game.tsv}"

                echo "Found provisional profile at alternate location: $PROFILE_DIR" \
                  >> "$DIAG_DIR/metadata.txt"

                cp -R "$PROFILE_DIR" "$DIAG_DIR/provisional-profile"
              fi
            fi

            SURVEY="$GAME_DIR/GameFiles/${DM_GAME}_survey/survey.md"

            if [[ -f "$SURVEY" ]]; then
              cp "$SURVEY" "$DIAG_DIR/survey.md"
              echo "Collected survey.md from: $SURVEY" \
                >> "$DIAG_DIR/metadata.txt"
            else
              SURVEY_MATCH="$(
                find "$GAME_DIR" -type f -name survey.md \
                  -path "*/${DM_GAME}_survey/*" \
                  -print -quit 2>/dev/null || true
              )"

              if [[ -n "$SURVEY_MATCH" ]]; then
                cp "$SURVEY_MATCH" "$DIAG_DIR/survey.md"
                echo "Collected survey.md from alternate location: $SURVEY_MATCH" \
                  >> "$DIAG_DIR/metadata.txt"
              else
                echo "WARNING: survey.md not found" \
                  >> "$DIAG_DIR/metadata.txt"
              fi
            fi

            HEAP_LOG="$GAME_DIR/GameFiles/${DM_GAME}_build/logs/heap_check.log"

            if [[ -f "$HEAP_LOG" ]]; then
              cp "$HEAP_LOG" "$DIAG_DIR/heap_check.log"
              echo "Collected heap_check.log from: $HEAP_LOG" \
                >> "$DIAG_DIR/metadata.txt"
            else
              HEAP_MATCH="$(
                find "$GAME_DIR" -type f -name heap_check.log \
                  -path "*/${DM_GAME}_build/*" \
                  -print -quit 2>/dev/null || true
              )"

              if [[ -n "$HEAP_MATCH" ]]; then
                cp "$HEAP_MATCH" "$DIAG_DIR/heap_check.log"
                echo "Collected heap_check.log from alternate location: $HEAP_MATCH" \
                  >> "$DIAG_DIR/metadata.txt"
              else
                echo "WARNING: heap_check.log not found" \
                  >> "$DIAG_DIR/metadata.txt"
              fi
            fi
          fi

          {
            echo ""
            echo "Diagnostic artifact contents:"
            find "$DIAG_DIR" -maxdepth 4 -type f -print
          } >> "$DIAG_DIR/metadata.txt"

          echo "Diagnostic collection complete."

      - name: Upload build diagnostics and provisional profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-${{ env.DM_GAME }}-diagnostics
          path: ${{ github.workspace }}/GameFiles/diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-${{ env.DM_GAME }}-IPA
          path: ${{ github.workspace }}/GameFiles/*.ipa
          if-no-files-found: error
          retention-days: 7
